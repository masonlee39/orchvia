# SPEC-0021 P02-P04. A version tag publishes; pull requests that touch packaging run everything except publishing.
name: Release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/build-packages.mjs'
      - 'scripts/build-python.py'
      - 'scripts/package-smoke.mjs'
      - 'scripts/registry-check.mjs'
      - 'scripts/release-version.mjs'
      - 'packages/engine/src/version.ts'
      - 'python/src/orchvia/_version.py'
      - 'packages/*/package.json'
      - 'python/pyproject.toml'
      - 'python/README.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/offline.yml

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The Version step checks that a tag is on main.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.14.6
      - run: npm ci --ignore-scripts
      - run: python -m pip install setuptools==80.9.0 wheel==0.45.1 build==1.2.2.post1 packaging==25.0 pyproject_hooks==1.2.0 twine==6.1.0
      - name: Version
        id: version
        shell: bash
        # A tag must equal the version in package.json, have a changelog section and be on main
        # (SPEC-0021 P09). Any other ref builds a throwaway version that is never published.
        run: |
          version="$(node scripts/release-version.mjs)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - run: node scripts/build-packages.mjs out --version "${{ steps.version.outputs.version }}"
      - run: python scripts/build-python.py out --version "${{ steps.version.outputs.version }}"
      - name: Install and run the archives offline
        run: PACKAGE_BUILD_PYTHON="$(command -v python)" node scripts/package-smoke.mjs out
      - name: Check publishing metadata without publishing
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          for name in engine adapter-claude adapter-codex sdk cli; do
            # The npm job skips a version that is already on the registry, so its dry run does too:
            # npm refuses to publish over a version, and the first npm publish is made by hand.
            if npm view "@orchvia/${name}@${VERSION}" version >/dev/null 2>&1; then
              echo "@orchvia/${name}@${VERSION} is already published; the npm job skips it"
              continue
            fi
            # A path must start with ./ or npm reads it as a GitHub repository.
            # npm requires a tag for a pre-release version, such as the throwaway version of a pull request.
            npm publish "./out/orchvia-${name}-${VERSION}.tgz" --dry-run --ignore-scripts --tag next
          done
          python -m twine check --strict out/*.whl out/*.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: out/
          if-no-files-found: error

  npm:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install --global npm@11.9.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: out
      - name: Publish in dependency order
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          tag=latest
          [[ "$VERSION" == *-* ]] && tag=next
          for name in engine adapter-claude adapter-codex sdk cli; do
            # A version on the registry is never rebuilt or overwritten; a rerun continues after it.
            if npm view "@orchvia/${name}@${VERSION}" version >/dev/null 2>&1; then
              echo "@orchvia/${name}@${VERSION} is already published"
              continue
            fi
            npm publish "./out/orchvia-${name}-${VERSION}.tgz" --access public --tag "$tag"
          done

  pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: out
      - run: mkdir python-dist && cp out/*.whl out/*.tar.gz python-dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: python-dist/
          skip-existing: true

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, npm, pypi]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: out
      - name: Create the release last
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME exists; its files are never replaced"
            exit 0
          fi
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          (cd out && sha256sum * > SHA256SUMS)
          prerelease=()
          [[ "$VERSION" == *-* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" out/* --verify-tag --title "Orchvia $VERSION" --notes-file notes.md "${prerelease[@]}"

  registry:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, github-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: 22.18.0
            python: 3.11.13
          - os: macos-14
            node: 24.14.0
            python: 3.14.6
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: out
      - name: Install from npm and PyPI into empty directories and run
        env:
          REGISTRY_CHECK_PYTHON: python
        run: node scripts/registry-check.mjs "${{ needs.build.outputs.version }}" out
