name: Offline contracts and packages
on:
  push:
  pull_request:
  workflow_dispatch:
  # The release workflow runs the same checks before publishing.
  workflow_call:
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: 22.18.0
            python: 3.11.13
          - os: ubuntu-24.04
            node: 24.14.0
            python: 3.14.6
          - os: macos-14
            node: 22.18.0
            # Last upstream 3.11 macOS arm64 installer in actions/python-versions.
            python: 3.11.9
          - os: macos-14
            node: 24.14.0
            python: 3.14.6
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: npm ci --ignore-scripts
      - run: npm run check:generated && npm run typecheck && npm run format:check
      - name: Node contract tests
        shell: bash
        run: |
          mkdir -p dist/verification/ci
          set -o pipefail
          npm test 2>&1 | tee dist/verification/ci/node.log
      - name: Python contract tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          mkdir -p dist/verification/ci
          set -o pipefail
          npm run test:python 2>&1 | tee dist/verification/ci/python.log
      - run: python -m pip install setuptools==80.9.0 wheel==0.45.1 build==1.2.2.post1 packaging==25.0 pyproject_hooks==1.2.0
      - run: npm run build:packages
      - run: python scripts/build-python.py dist/release
      - name: Clean offline npm, wheel and sdist installation
        run: PACKAGE_BUILD_PYTHON="$(command -v python)" npm run test:packages
      - run: node scripts/capacity-benchmark.ts 1000,10000 100 > dist/capacity.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: offline-${{ matrix.os }}-node-${{ matrix.node }}-python-${{ matrix.python }}
          path: dist/
          if-no-files-found: ignore
  pinned-native-protocol:
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel covers x86-64 Macs; macos-14 is Apple silicon.
        os: [ubuntu-24.04, macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.11.9
      - run: npm ci --ignore-scripts
      - name: Install exact native development dependencies (no login or model calls)
        run: npm install --ignore-scripts --no-save --package-lock=false @anthropic-ai/claude-agent-sdk@0.3.283 @openai/codex@0.157.1
      - run: node scripts/check-native-protocol.mjs
      # The writable Claude profile requires the OS sandbox; on Linux that is bubblewrap and socat.
      # The benchmark's stop proof lists processes with lsof.
      - name: Install the Linux sandbox dependencies of the writable Claude profile
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap socat lsof
      - name: Real Claude binary with a scripted loopback gateway (no paid models)
        run: node scripts/native-gateway-smoke.mjs claude dist/verification/native-claude.json
      - name: Usage outside the main loop with the real Claude binary and a scripted loopback gateway (no paid models)
        if: ${{ !cancelled() }}
        run: node scripts/native-usage-smoke.mjs dist/verification/native-usage.json
      # SPEC-0032 C06: the same records on a Claude Code whose session totals start again at resume.
      - name: Usage outside the main loop with Claude SDK 0.3.274 (no paid models)
        if: ${{ !cancelled() }}
        run: |
          npm install --prefix "$RUNNER_TEMP/claude-sdk-0.3.274" --ignore-scripts --no-save --package-lock=false --no-audit --no-fund @anthropic-ai/claude-agent-sdk@0.3.274
          node scripts/native-usage-smoke.mjs dist/verification/native-usage-0.3.274.json "$RUNNER_TEMP/claude-sdk-0.3.274/node_modules/@anthropic-ai/claude-agent-sdk/sdk.mjs"
      - name: README quickstart with the real Claude binary and a scripted loopback gateway (no paid models)
        if: ${{ !cancelled() }}
        run: node scripts/quickstart-claude-smoke.mjs
      - name: Benchmark arms with the real Claude binary and a scripted loopback gateway (no paid models)
        if: ${{ !cancelled() }}
        run: node bench/run.mjs --gateway --require-pass --out dist/verification/bench-gateway.json
      - name: Real Codex binary with a scripted loopback gateway (no paid models)
        if: ${{ !cancelled() }}
        run: node scripts/native-gateway-smoke.mjs codex dist/verification/native-codex.json ./node_modules/.bin/codex
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: native-gateway-${{ matrix.os }}
          path: dist/verification/
