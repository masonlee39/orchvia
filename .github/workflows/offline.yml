name: Offline contracts and packages
on:
  push:
  pull_request:
  workflow_dispatch:
  # The release workflow runs the same checks before publishing.
  workflow_call:
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: 22.18.0
            python: 3.11.13
          - os: ubuntu-24.04
            node: 24.14.0
            python: 3.14.6
          - os: macos-14
            node: 22.18.0
            # Last upstream 3.11 macOS arm64 installer in actions/python-versions.
            python: 3.11.9
          - os: macos-14
            node: 24.14.0
            python: 3.14.6
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: npm ci --ignore-scripts
      - run: npm run check:generated && npm run typecheck && npm run format:check
      - name: Node contract tests
        shell: bash
        run: |
          mkdir -p dist/verification/ci
          set -o pipefail
          npm test 2>&1 | tee dist/verification/ci/node.log
      - name: Python contract tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          mkdir -p dist/verification/ci
          set -o pipefail
          npm run test:python 2>&1 | tee dist/verification/ci/python.log
      # SPEC-0033 Y05: the Python SDK's views work with a type checker; mypy is a CI tool only.
      - name: Python types with pinned mypy
        if: ${{ !cancelled() }}
        run: |
          python -m pip install mypy==2.3.1
          python scripts/check-python-types.py
      - run: python -m pip install setuptools==80.9.0 wheel==0.45.1 build==1.2.2.post1 packaging==25.0 pyproject_hooks==1.2.0
      - run: npm run build:packages
      - run: python scripts/build-python.py dist/release
      - name: Clean offline npm, wheel and sdist installation
        run: PACKAGE_BUILD_PYTHON="$(command -v python)" npm run test:packages
      - run: node scripts/capacity-benchmark.ts 1000,10000 100 > dist/capacity.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: offline-${{ matrix.os }}-node-${{ matrix.node }}-python-${{ matrix.python }}
          path: dist/
          if-no-files-found: ignore
  pinned-native-protocol:
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel covers x86-64 Macs; macos-14 is Apple silicon.
        os: [ubuntu-24.04, macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.11.9
      - run: npm ci --ignore-scripts
      - name: Install exact native development dependencies (no login or model calls)
        run: npm install --ignore-scripts --no-save --package-lock=false @anthropic-ai/claude-agent-sdk@0.3.283 @openai/codex@0.157.1
      - run: node scripts/check-native-protocol.mjs
      # The writable Claude profile requires the OS sandbox; on Linux that is bubblewrap and socat.
      # The benchmark's stop proof lists processes with lsof.
      - name: Install the Linux sandbox dependencies of the writable Claude profile
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap socat lsof
          # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor; bubblewrap then
          # fails with "loopback: Failed RTM_NEWADDR" and no sandboxed command runs (SPEC-0034 C01).
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Real Claude binary with a scripted loopback gateway (no paid models)
        run: node scripts/native-gateway-smoke.mjs claude dist/verification/native-claude.json
      - name: Usage outside the main loop with the real Claude binary and a scripted loopback gateway (no paid models)
        if: ${{ !cancelled() }}
        run: node scripts/native-usage-smoke.mjs dist/verification/native-usage.json
      # SPEC-0032 C06: the same records on a Claude Code whose session totals start again at resume.
      - name: Usage outside the main loop with Claude SDK 0.3.274 (no paid models)
        if: ${{ !cancelled() }}
        run: |
          npm install --prefix "$RUNNER_TEMP/claude-sdk-0.3.274" --ignore-scripts --no-save --package-lock=false --no-audit --no-fund @anthropic-ai/claude-agent-sdk@0.3.274
          node scripts/native-usage-smoke.mjs dist/verification/native-usage-0.3.274.json "$RUNNER_TEMP/claude-sdk-0.3.274/node_modules/@anthropic-ai/claude-agent-sdk/sdk.mjs"
      - name: README quickstart with the real Claude binary and a scripted loopback gateway (no paid models)
        if: ${{ !cancelled() }}
        run: node scripts/quickstart-claude-smoke.mjs
      - name: Benchmark arms with the real Claude binary and a scripted loopback gateway (no paid models)
        if: ${{ !cancelled() }}
        run: node bench/run.mjs --gateway --require-pass --out dist/verification/bench-gateway.json
      - name: Real Codex binary with a scripted loopback gateway (no paid models)
        if: ${{ !cancelled() }}
        run: node scripts/native-gateway-smoke.mjs codex dist/verification/native-codex.json ./node_modules/.bin/codex
      # SPEC-0034: a command the runtime leaves running must not release the execution lease.
      - name: Stop proof with the real Claude binary and a scripted loopback gateway (no paid models)
        if: ${{ !cancelled() }}
        run: node scripts/native-stop-smoke.mjs claude dist/verification/native-stop-claude.json
      - name: Stop proof with the real Codex binary and a scripted loopback gateway (no paid models)
        if: ${{ !cancelled() }}
        run: node scripts/native-stop-smoke.mjs codex dist/verification/native-stop-codex.json ./node_modules/.bin/codex
      # SPEC-0038: an approved patch stays in the workspace; commands see no credentials.
      - name: Codex file change paths and command environment with the real Codex binary (no paid models)
        if: ${{ !cancelled() }}
        run: node scripts/native-codex-security-smoke.mjs dist/verification/native-codex-security.json ./node_modules/.bin/codex
      # SPEC-0035: the local Codex CLI as a member; the pinned binary also runs the internet checks.
      - name: Local Codex member with the real Codex binary, internet checks included (no paid models)
        if: ${{ !cancelled() }}
        env:
          ORCH_INTERNET: '1'
        run: node scripts/native-codex-local-smoke.mjs dist/verification/native-codex-local.json ./node_modules/.bin/codex
      - name: Local Codex member with Codex 0.153.4, the oldest supported (no paid models)
        if: ${{ !cancelled() }}
        run: |
          npm install --ignore-scripts --no-save --package-lock=false --prefix "$RUNNER_TEMP/codex-0.153.4" @openai/codex@0.153.4
          node scripts/native-codex-local-smoke.mjs dist/verification/native-codex-local-0.153.4.json "$RUNNER_TEMP/codex-0.153.4/node_modules/.bin/codex"
      - name: Codex 0.158.0, the newest checked, as a local member and on the security paths (no paid models)
        if: ${{ !cancelled() }}
        run: |
          npm install --ignore-scripts --no-save --package-lock=false --prefix "$RUNNER_TEMP/codex-0.158.0" @openai/codex@0.158.0
          node scripts/native-codex-local-smoke.mjs dist/verification/native-codex-local-0.158.0.json "$RUNNER_TEMP/codex-0.158.0/node_modules/.bin/codex"
          node scripts/native-codex-security-smoke.mjs dist/verification/native-codex-security-0.158.0.json "$RUNNER_TEMP/codex-0.158.0/node_modules/.bin/codex"
      # SPEC-0035 I01: commands of a bash login shell hold their marker too; Linux runners use bash
      # already, macOS runners zsh, so the macOS runners change it.
      - name: Local Codex member under a bash login shell (no paid models)
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        env:
          ORCH_EXPECT_SHELL: bash
        run: |
          sudo chsh -s /bin/bash "$USER"
          node scripts/native-codex-local-smoke.mjs dist/verification/native-codex-local-bash.json ./node_modules/.bin/codex
      # SPEC-0043 C02: what the writable Claude profile's Bash commands can read.
      - name: Claude read fence with the real Claude binary and a scripted loopback gateway (no paid models)
        if: ${{ !cancelled() }}
        run: node scripts/native-read-fence-smoke.mjs dist/verification/native-read-fence.json
      # SPEC-0036: a killed host's leftover command is ended by the next host's sweep.
      - name: Stop markers across a host restart with the real Claude binary (no paid models)
        if: ${{ !cancelled() }}
        run: node scripts/native-stop-restart-smoke.mjs dist/verification/native-stop-restart.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: native-gateway-${{ matrix.os }}
          path: dist/verification/
